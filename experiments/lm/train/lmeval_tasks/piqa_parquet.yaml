# Replacement for lm_eval 0.4.3's stock `piqa` task.
#
# Upstream sets dataset_path: piqa + trust_remote_code: true. That repo is
# script-based, and datasets 5.0 removed script loading entirely, so the stock
# task dies with "Dataset scripts are no longer supported, but found piqa.py".
# The Hub auto-converts every dataset to Parquet under the refs/convert/parquet
# revision, which loads without a script.
#
# Registered under a DISTINCT name rather than as a same-name override: an
# include_path does not shadow a packaged task in 0.4.3, so a file declaring
# `task: piqa` silently lost to the broken packaged one. Everything below the
# dataset lines is byte-identical to upstream, so scores remain comparable to
# published piqa numbers.
task: piqa_parquet
dataset_path: ybisk/piqa
dataset_name: null
dataset_kwargs:
  revision: refs/convert/parquet
output_type: multiple_choice
training_split: train
validation_split: validation
test_split: null
doc_to_text: "Question: {{goal}}\nAnswer:"
doc_to_target: label
doc_to_choice: "{{[sol1, sol2]}}"
should_decontaminate: true
doc_to_decontamination_query: goal
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
